[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "plcsim-connector"
version = "0.1.0"
description = "Python connector for SIMATIC S7-PLCSIM Advanced digital I/O"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7", "black", "mypy"]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.args = ["-DPLCSIM_BUILD_TESTS=OFF", "-DPLCSIM_BUILD_EXAMPLES=OFF"]
wheel.packages = []
build-dir = "build/skbuild"

[tool.scikit-build.cmake.define]
PLCSIM_BUILD_PYTHON = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a running S7-PLCSIM Advanced instance",
]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
